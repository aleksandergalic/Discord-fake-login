<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Discord fake login</title>

  <!-- Connect the CSS file -->
  <link rel="stylesheet" href="style.css">

  <!-- Connect the JavaScript file -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="script.js" defer></script>
</head>

<body>

  <div class="logo">
  </div>

  <main class="login-card">
    <section class="login-section">
      <h1>Welcome back!</h1>
      <p class="subtitle">We're so excited to see you again.</p>

      <form id="demo-form">
        <label for="username">Email or username</label>
        <input id="username" type="text" autocomplete="off">

        <label for="password">Password</label>
        <input id="password" type="password" autocomplete="off">

        <a href="#demo-info" class="forgot">
          Forgot your password?
        </a>

        <button type="submit">Login</button>

        <p class="register">
          Need an account? <a href="#demo-info">Register</a>
        </p>
      </form>
    </section>

    <aside class="qr-section">
      <div class="qr-wrapper">
        <div id="qrcode"></div>
        <img class="qr-logo" src="qr_code_middle.png" alt="Discord logo">
      </div>
      <h2>Log in with QR Code</h2>
      <p>
        Scan this with the <b>Discord mobile
          app to log in instantly.</b><br>
        <a href="#" id="passkey">Or sign in with a passkey</a>
      </p>
    </aside>


  </main>
  <!-- <footer><p id="demo-info" class="demo-notice" role="status">
      Educational demo. No credentials are stored or transmitted.
    </p></footer> -->
</body>

</html>
